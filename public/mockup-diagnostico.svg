  <text x="80" y="377" font-size="11" fill="#7a4040">EE.TT. indica 2.380 m². Memoria de cálculo señala 2.410 m². Diferencia de 30 m²</text>
  <text x="80" y="393" font-size="11" fill="#7a4040">genera errores en presupuesto de terminaciones y gastos generales.</text>
  <text x="1000" y="371" font-size="11" fill="#9fb3c0">EE.TT. p.12 vs Mem. Cálculo p.4</text>
  <rect x="1296" y="347" width="84" height="22" rx="11" fill="#ef4444" opacity="0.15"/>
  <rect x="1296" y="347" width="84" height="22" rx="11" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4"/>

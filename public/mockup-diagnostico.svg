  <text x="1338" y="498" font-size="10" fill="#f59e0b" text-anchor="middle">▲ Media</text>
  <text x="1500" y="507" font-size="12" fill="#f59e0b" font-weight="600">~$4.2M</text>
  <rect x="1676" y="483" width="90" height="22" rx="11" fill="#1a3a5c" opacity="0.3"/>
  <text x="1721" y="498" font-size="10" fill="#3a6080" text-anchor="middle">Pendiente</text>


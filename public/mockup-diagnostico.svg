    <linearGradient id="fadeBottom2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080f1e" stop-opacity="0"/>
      <stop offset="85%" stop-color="#080f1e" stop-opacity="0.85"/>
